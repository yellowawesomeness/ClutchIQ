[project]
name = "code-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7,<7",
    "demoparser2>=0.0.0",
]

[project.scripts]
clutchiq = "clutchiq.cli:main"

[tool.pytest.ini_options]
markers = [
    "integration: tests that require the real demo file and demoparser2",
]
